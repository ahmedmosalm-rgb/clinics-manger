<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أحمد المطور - النسخة السحابية ☁️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة Excel JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .clinic-card { transition: all 0.3s ease; border-right: 4px solid transparent; }
        .clinic-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-right-color: #3b82f6; }
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-action { transition: all 0.2s; }
        .btn-action:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <p id="loaderText" class="text-blue-600 font-bold">جاري الاتصال بسحابة أحمد... ☁️</p>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h1 class="text-3xl font-black text-slate-800">إدارة عيادات أحمد <span class="text-blue-600 text-sm font-normal">نسخة السحابة 2.5</span></h1>
                <p id="statusTag" class="text-slate-400 text-sm mt-1">جاري التحقق من الاتصال...</p>
            </div>
            <div class="flex flex-wrap justify-center gap-2">
                <!-- زر استيراد -->
                <button onclick="document.getElementById('excelInput').click()" class="btn-action bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-emerald-100">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                    <span>استيراد إكسيل</span>
                </button>
                <input type="file" id="excelInput" class="hidden" accept=".xlsx, .xls" onchange="importExcelToFirebase(event)">

                <!-- زر تصدير -->
                <button onclick="exportToExcel()" class="btn-action bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-slate-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    <span>تصدير إكسيل</span>
                </button>

                <!-- زر إضافة يدوي -->
                <button onclick="document.getElementById('addModal').classList.remove('hidden')" class="btn-action bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-bold shadow-lg shadow-blue-200 transition-all">
                    + إضافة عيادة
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-4 rounded-2xl border border-slate-100">
                <p class="text-slate-400 text-xs font-bold mb-1">إجمالي العيادات</p>
                <p id="totalCount" class="text-2xl font-black text-slate-800">0</p>
            </div>
            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                <p class="text-blue-400 text-xs font-bold mb-1">عيادات VIP ⭐</p>
                <p id="vipCount" class="text-2xl font-black text-blue-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-100">
                <p class="text-slate-400 text-xs font-bold mb-1">تحديثات السحابة</p>
                <div id="syncIndicator" class="flex items-center gap-2 mt-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-xs font-bold text-green-600">مزامنة نشطة</span>
                </div>
            </div>
            <div class="bg-slate-800 p-4 rounded-2xl text-white flex flex-col justify-center">
                <p class="text-slate-400 text-[10px] font-bold">حالة النظام</p>
                <p class="text-sm font-bold">متصل بالسحابة ✅</p>
            </div>
        </div>

        <!-- Cards Container -->
        <div id="clinicsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- الكروت تظهر هنا -->
        </div>
    </div>

    <!-- Modal إضافة عيادة -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-40 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl relative">
            <button onclick="document.getElementById('addModal').classList.add('hidden')" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            <h3 class="text-2xl font-black text-slate-800 mb-6">إضافة عيادة للسحابة</h3>
            <form id="clinicForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">اسم العيادة</label>
                    <input type="text" id="name" required class="w-full bg-slate-50 border-0 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">المنطقة</label>
                        <input type="text" id="area" required class="w-full bg-slate-50 border-0 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">الطبيب</label>
                        <input type="text" id="doctor" required class="w-full bg-slate-50 border-0 rounded-xl p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="flex items-center gap-2 p-3 bg-blue-50 rounded-xl">
                    <input type="checkbox" id="priority" class="w-5 h-5 text-blue-600 rounded">
                    <label for="priority" class="text-sm font-bold text-blue-700">تمييز كـ عيادة VIP ⭐</label>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl hover:bg-blue-700 transition-all">حفظ في السحابة</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, serverTimestamp, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        // استخدام الإعدادات التلقائية للنظام لحل مشكلة الـ API Key Expired
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyCzgP3hQUhruUk1aLn3W42un0G3pUXjwTU",
                authDomain: "ahmed-clinics-6b9ef.firebaseapp.com",
                projectId: "ahmed-clinics-6b9ef",
                storageBucket: "ahmed-clinics-6b9ef.firebasestorage.app",
                messagingSenderId: "755653378017",
                appId: "1:755653378017:web:b08bf729934b253c199ca0"
            };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // جلب معرف التطبيق تلقائياً أو استخدام الافتراضي
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'ahmed-clinics-6b9ef';
        const CLINICS_PATH = collection(db, 'artifacts', currentAppId, 'public', 'data', 'clinics_list');

        let allClinics = [];

        // إدارة المصادقة بشكل صحيح
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('statusTag').innerHTML = "خطأ في الاتصال بالسحابة ❌";
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                startSync();
            } else {
                initAuth();
            }
        });

        function startSync() {
            onSnapshot(CLINICS_PATH, (snapshot) => {
                allClinics = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateUI();
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('statusTag').innerHTML = "السحابة متصلة ومحدثة ✅";
            }, (error) => {
                console.error("Sync Error:", error);
                document.getElementById('statusTag').innerHTML = "خطأ في المزامنة ❌";
            });
        }

        // إضافة عيادة واحدة
        document.getElementById('clinicForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!auth.currentUser) return;
            
            const data = {
                name: document.getElementById('name').value,
                area: document.getElementById('area').value,
                doctor: document.getElementById('doctor').value,
                priority: document.getElementById('priority').checked,
                createdAt: serverTimestamp()
            };
            try {
                await setDoc(doc(CLINICS_PATH, `clinic_${Date.now()}`), data);
                document.getElementById('addModal').classList.add('hidden');
                e.target.reset();
            } catch (err) {
                alert("حدث خطأ أثناء الحفظ");
            }
        };

        // دالة الاستيراد من إكسيل
        window.importExcelToFirebase = function(event) {
            const file = event.target.files[0];
            if (!file || !auth.currentUser) return;

            document.getElementById('loaderText').innerText = "جاري رفع بيانات الإكسيل للسحابة... 📤";
            document.getElementById('loadingOverlay').classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(sheet);

                    if (jsonData.length > 0) {
                        const batch = writeBatch(db);
                        jsonData.forEach((row, index) => {
                            const newId = `imported_${Date.now()}_${index}`;
                            const docRef = doc(CLINICS_PATH, newId);
                            batch.set(docRef, {
                                name: row['اسم العيادة'] || row['Name'] || 'بدون اسم',
                                area: row['المنطقة'] || row['Area'] || 'غير محدد',
                                doctor: row['اسم الدكتور'] || row['Doctor'] || 'غير معروف',
                                priority: (row['VIP'] === 'نعم' || row['priority'] === true),
                                createdAt: serverTimestamp(),
                                imported: true
                            });
                        });
                        await batch.commit();
                        alert(`تم استيراد ${jsonData.length} عيادة بنجاح!`);
                    }
                } catch (err) {
                    alert("خطأ في معالجة الملف");
                }
                document.getElementById('loadingOverlay').classList.add('hidden');
            };
            reader.readAsArrayBuffer(file);
        };

        window.deleteClinic = async (id) => {
            if (!auth.currentUser) return;
            if(confirm("حذف العيادة من السحابة؟")) {
                await deleteDoc(doc(CLINICS_PATH, id));
            }
        };

        window.exportToExcel = () => {
            const ws = XLSX.utils.json_to_sheet(allClinics);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "العيادات");
            XLSX.writeFile(wb, "Clinics_Cloud_Backup.xlsx");
        };

        function updateUI() {
            const grid = document.getElementById('clinicsGrid');
            grid.innerHTML = '';
            document.getElementById('totalCount').innerText = allClinics.length;
            document.getElementById('vipCount').innerText = allClinics.filter(c => c.priority).length;

            allClinics.sort((a,b) => (b.priority - a.priority)).forEach(c => {
                const card = document.createElement('div');
                card.className = `clinic-card bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col ${c.priority ? 'bg-gradient-to-br from-white to-blue-50 border-blue-200' : ''}`;
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="px-2 py-1 bg-slate-100 text-slate-500 rounded-lg text-[10px] font-bold">${c.area}</span>
                        <button onclick="deleteClinic('${c.id}')" class="text-slate-300 hover:text-red-500 transition-colors">
                             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                    <h4 class="text-xl font-black text-slate-800 mb-2">${c.name} ${c.priority ? '⭐' : ''}</h4>
                    <p class="text-sm text-slate-500 font-bold mb-4">دكتور: <span class="text-slate-700">${c.doctor}</span></p>
                    <div class="mt-auto pt-4 border-t border-slate-50 flex justify-between items-center text-[10px] text-slate-400">
                        <span>سحابي ☁️</span>
                        <button class="bg-blue-600 text-white px-4 py-1 rounded-lg font-bold">زيارة</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
